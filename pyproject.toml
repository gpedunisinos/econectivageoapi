[project]
name = "unisinos-usp-geo-api"
version = "0.1.0"
description = "Serviço geoespacial para contexto socioambiental e camadas da plataforma Unisinos/USP"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.4",
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "pydantic-settings==2.10.1",
  "psycopg[binary,pool]==3.2.9",
  "rasterio==1.4.3",
  "rio-tiler==7.8.1",
  "numpy==2.3.2",
  "pillow==11.3.0",
  "pyproj==3.7.1",
  "shapely==2.1.1",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
